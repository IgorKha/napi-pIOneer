# napi-pioneer — панель на https://<плата>/pioneer/
# Ставится deploy/install.sh в /etc/nginx/snippets/pioneer.conf; штатный nginx.conf уже делает
# `include /etc/nginx/snippets/*.conf;` внутри HTTPS-сервера, сам nginx.conf не меняется.
# $connection_upgrade определён в штатном nginx.conf (map для WebSocket).
location /pioneer/ {
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;  # cookie сессии с флагом Secure
    proxy_set_header Upgrade $http_upgrade;       # WebSocket /pioneer/ws
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;                        # WS живёт долго
    proxy_buffering off;

    # редактор скриптов (Monaco) ~3.9 МБ JS -> ~1 МБ
    gzip on;
    gzip_types text/javascript application/javascript text/css application/json;
    gzip_min_length 1024;
}
