[project]
name = "napi-pioneer"
version = "0.0.1"
description = "Визуальное программирование Napi-C: node-граф + Python, исполнение на плате"
requires-python = ">=3.12"
# Версии = системные пакеты NapiLinux 0.3.1 (на плату ничего не ставим через pip)
dependencies = [
    "fastapi==0.111.0",
    "starlette==0.37.2",
    "pydantic==2.8.2",
    "uvicorn==0.30.1",
    "PyYAML==6.0.1",
    "openai==2.26.0",
    "anthropic==0.84.0",
    "jedi==0.19.2",
    "pillow==10.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pip==24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
